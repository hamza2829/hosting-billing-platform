spring.application.name=payment-service
spring.config.import=classpath:application-common.properties
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hosting?currentSchema=payments}
spring.datasource.username=${DATABASE_USER:hosting}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.schemas=payments
spring.jpa.properties.hibernate.default_schema=payments
outbox.enabled=true
payment.provider-url=${PAYMENT_PROVIDER_URL:http://localhost:8090}
payment.retry-delay-ms=${PAYMENT_RETRY_DELAY_MS:300}
