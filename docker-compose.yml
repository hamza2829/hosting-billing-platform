name: hosting-billing-platform
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hosting
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run node tests/setup.mjs}
      POSTGRES_DB: hosting
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hosting"]
      interval: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 5s
      retries: 40
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["elastic_data:/usr/share/elasticsearch/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow",
        ]
      interval: 5s
      retries: 50
  mock-payment-api:
    build:
      context: .
      dockerfile: tests/provider.Dockerfile
    ports: ["127.0.0.1:8090:8090"]
    volumes: ["provider_data:/data"]
  billing-service:
    build: { context: ., args: { SERVICE: billing-service } }
    environment:
      API_KEY: ${API_KEY:?Run node tests/setup.mjs}
      DATABASE_URL: jdbc:postgresql://postgres:5432/hosting?currentSchema=billing
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BILLING_MONTHLY_CRON: ${BILLING_MONTHLY_CRON:-0 0 0 1 * *}
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      retries: 40
  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    environment:
      API_KEY: ${API_KEY}
      DATABASE_URL: jdbc:postgresql://postgres:5432/hosting?currentSchema=payments
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_PROVIDER_URL: http://mock-payment-api:8090
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      retries: 40
  audit-search-service:
    build: { context: ., args: { SERVICE: audit-search-service } }
    environment:
      API_KEY: ${API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports: ["127.0.0.1:8083:8080"]
    depends_on:
      kafka: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      retries: 40
volumes:
  postgres_data:
  elastic_data:
  provider_data:
