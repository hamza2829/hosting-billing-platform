spring.application.name=billing-service
spring.config.import=classpath:application-common.properties
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hosting?currentSchema=billing}
spring.datasource.username=${DATABASE_USER:hosting}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.schemas=billing
spring.jpa.properties.hibernate.default_schema=billing
outbox.enabled=true
billing.monthly-cron=${BILLING_MONTHLY_CRON:0 0 0 1 * *}
billing.zone=UTC
